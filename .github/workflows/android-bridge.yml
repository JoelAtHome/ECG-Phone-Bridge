name: android-bridge

on:
  workflow_dispatch:
    inputs:
      upload_to_release_tag:
        description: "Optional. Published release tag to attach the APK to (e.g. v1.0.0-beta.4). Leave empty to build only and download the Actions artifact."
        required: false
        type: string
        default: ""
  release:
    types:
      - published
  push:
    branches:
      - main
    paths:
      - "PolarH10Bridge/**"
      - ".github/workflows/android-bridge.yml"
  pull_request:
    branches:
      - main
    paths:
      - "PolarH10Bridge/**"
      - ".github/workflows/android-bridge.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PolarH10Bridge

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PolarH10Bridge-release-apk
          path: PolarH10Bridge/app/build/outputs/apk/release/app-release.apk

  upload-to-release:
    needs: build-apk
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: release_tag
        env:
          MANUAL_TAG: ${{ github.event.inputs.upload_to_release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            T="${{ github.ref_name }}"
          else
            T=$(printf '%s' "$MANUAL_TAG" | tr -d '\r' | xargs)
          fi
          if [ -z "$T" ]; then
            echo "::error::Release tag is empty."
            exit 1
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      - name: Download release APK artifact
        uses: actions/download-artifact@v7
        with:
          name: PolarH10Bridge-release-apk
          path: apk

      - name: Attach APK to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release_tag.outputs.tag }}"
          test -f apk/app-release.apk
          cp apk/app-release.apk "PolarH10Bridge-${TAG}.apk"
          FILE="PolarH10Bridge-${TAG}.apk"
          found=
          for i in $(seq 1 30); do
            if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
              found=1
              break
            fi
            echo "Release not visible yet for tag '$TAG' (attempt $i/30); waiting 10s..."
            sleep 10
          done
          if [ -z "$found" ]; then
            echo "::error::No published GitHub release found for tag '$TAG' after waiting."
            echo "Recent releases (check tag spelling, including leading 'v'):"
            gh release list -L 15 || true
            exit 1
          fi
          gh release upload "$TAG" "$FILE" --clobber
